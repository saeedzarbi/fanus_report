{% extends 'admin/change_list.html' %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<style>
    html, body, * {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif !important;
    }
</style>
{% endblock %}

{% block object-tools %}
    <form action="." method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" name="run_analysis" 
                style="background: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">
            🤖 اجرای تحلیل دستی هوش مصنوعی
        </button>
    </form>
    {{ block.super }}
{% endblock %}
